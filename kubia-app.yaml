apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubia
  namespace: argocd
spec:
  project: kubia-project

  source:
    repoURL: https://github.com/Shashwot023/argocd_test.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
